[project]
name = "backend"
version = "0.1.0"
description = "Backend for digital realtime dashboard"
readme = "README.md"
authors = [
    { name = "LyheangDev", email = "lyheangdev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.scripts]
backend = "main:main"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
