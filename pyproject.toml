[project]
name = "backend"
version = "1.0.0"
description = "Backend for digital realtime dashboard"
readme = "README.md"
authors = [
    { name = "LyheangDev", email = "lyheangdev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.47",
]

[project.scripts]
backend = "main:main"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
